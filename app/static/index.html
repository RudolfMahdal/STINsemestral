<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Analyzer Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .grid { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 150px; padding: 15px; background: #ecf0f1; border-radius: 5px; text-align: center; }
        .value { font-size: 24px; font-weight: bold; color: #e74c3c; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #34495e; color: white; }
        .auth-box { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; background: #fff3cd; border-radius: 5px; }
        .settings-box { margin-bottom: 20px; padding: 15px; border: 1px solid #bce8f1; background: #d9edf7; border-radius: 5px; }
        input, button { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: white; border: none; cursor: pointer; }
        button:hover { background: #2980b9; }
        .success-msg { color: #27ae60; font-weight: bold; display: none; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Currency Analyzer 📈</h1>

    <!-- Global Error Banner -->
    <div id="app-error" style="display: none; background: #f8d7da; color: #721c24; padding: 10px; border: 1px solid #f5c6cb; border-radius: 5px; margin-bottom: 20px;">
        <strong>Error:</strong> <span id="error-text"></span>
    </div>
    
    <!-- Login Section -->
    <div class="auth-box" id="auth-section">
        <h3>Admin Login</h3>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password">
        <button onclick="loadData()">Load Data</button>
        <p id="error-msg" style="color: red; display: none;">Login failed. Check credentials.</p>
    </div>

    <!-- Settings Section (Hidden by default) -->
    <div class="settings-box" id="settings-section" style="display: none;">
        <h3>⚙️ Configuration</h3>
        <label>Base Currency:</label>
        <input type="text" id="input-base" style="width: 60px;">
        
        <label style="margin-left: 15px;">Compare to (comma separated):</label>
        <input type="text" id="input-symbols" style="width: 200px;">
        
        <button onclick="saveSettings()" style="margin-left: 10px; background: #2ecc71;">Save & Recalculate</button>
        <span id="save-msg" class="success-msg">Saved!</span>
    </div>

    <!-- Data Section (Hidden by default) -->
    <div id="data-section" style="display: none;">
        <h2>Analysis Results</h2>
        <p>Base Currency: <strong id="base-curr">-</strong> | Date: <span id="date-val">-</span></p>

        <div class="grid">
            <div class="card">
                <div>Strongest</div>
                <div class="value" id="strongest">-</div>
            </div>
            <div class="card">
                <div>Weakest</div>
                <div class="value" id="weakest">-</div>
            </div>
            <div class="card">
                <div>Average Rate</div>
                <div class="value" id="average">-</div>
            </div>
        </div>

        <h2>Raw Rates</h2>
        <table>
            <thead>
                <tr>
                    <th>Currency Pair</th>
                    <th>Rate</th>
                </tr>
            </thead>
            <tbody id="rates-table">
                <!-- Data will be injected here via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function getAuthHeaders() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const headers = new Headers();
        headers.set('Authorization', 'Basic ' + btoa(user + ":" + pass));
        headers.set('Content-Type', 'application/json');
        return headers;
    }

    function showError(message) {
        const errDiv = document.getElementById('app-error');
        document.getElementById('error-text').innerText = message;
        errDiv.style.display = 'block';
    }

    function hideError() {
        document.getElementById('app-error').style.display = 'none';
    }

    async function loadData() {
        hideError(); // Reset errors on new request
        const authError = document.getElementById('error-msg');
        const dataSection = document.getElementById('data-section');
        const settingsSection = document.getElementById('settings-section');
        
        try {
            const response = await fetch('/api/v1/analyze', { method: 'GET', headers: getAuthHeaders() });
            
            if (response.status === 401) {
                authError.style.display = 'block';
                dataSection.style.display = 'none';
                settingsSection.style.display = 'none';
                return;
            }
            
            const data = await response.json();

            if (!response.ok) {
                showError(data.detail || "Failed to load data from server.");
                return;
            }
            
            authError.style.display = 'none';
            dataSection.style.display = 'block';
            settingsSection.style.display = 'block';

            document.getElementById('input-base').value = data.settings_used.base;
            document.getElementById('input-symbols').value = data.settings_used.symbols;

            if (data.settings_used.base !== data.base_currency) {
                showError(`Warning: You requested base '${data.settings_used.base}', but the Free API forced '${data.base_currency}'.`);
            }

            document.getElementById('base-curr').innerText = data.base_currency;
            document.getElementById('date-val').innerText = new Date(data.date * 1000).toLocaleDateString() || data.date;
            document.getElementById('strongest').innerText = data.strongest_currency;
            document.getElementById('weakest').innerText = data.weakest_currency;
            document.getElementById('average').innerText = data.average_rate.toFixed(4);

            const tbody = document.getElementById('rates-table');
            tbody.innerHTML = "";
            if (data.analyzed_rates) {
                for (const [currency, rate] of Object.entries(data.analyzed_rates)) {
                    tbody.innerHTML += `<tr><td>${currency}</td><td>${rate}</td></tr>`;
                }
            }

        } catch (error) {
            console.error('Error:', error);
            showError("Network error: Could not connect to the API.");
        }
    }

    async function saveSettings() {
        hideError();
        const newBase = document.getElementById('input-base').value.toUpperCase().trim();
        const newSymbols = document.getElementById('input-symbols').value.toUpperCase().trim();
        
        if (!newBase || !newSymbols) {
            showError("Base currency and symbols cannot be empty.");
            return;
        }

        const payload = {
            base_currency: newBase,
            selected_currencies: newSymbols
        };

        try {
            const response = await fetch('/api/v1/settings', { 
                method: 'PUT', 
                headers: getAuthHeaders(),
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                const msg = document.getElementById('save-msg');
                msg.style.display = 'inline';
                setTimeout(() => msg.style.display = 'none', 2000);
                
                loadData();
            } else {
                showError(data.detail || "Failed to save settings.");
            }
        } catch (error) {
            console.error('Error saving settings:', error);
            showError("Network error while saving settings.");
        }
    }
</script>

</body>
</html>
